name: Android Auto Build & Release

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  pull_request:
    branches:
      - '**'
  release:
    types:
      - published
      - created
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (all, debug, release, bundle)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - debug
          - release
          - bundle
      run_tests:
        description: 'Run Unit Tests'
        required: false
        default: true
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write
  packages: write

jobs:
  build-and-release:
    name: Build & Export Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'tools platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Set up Debug Keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            echo "Restoring debug keystore from debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            echo "Generating debug keystore..."
            keytool -genkeypair -v -keystore debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Check & Prepare Release Signing Secrets
        id: signing-check
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "${ANDROID_KEYSTORE_B64}" ] && [ -n "${ANDROID_KEYSTORE_PASSWORD}" ] && [ -n "${ANDROID_KEY_ALIAS}" ] && [ -n "${ANDROID_KEY_PASSWORD}" ]; then
            echo "Release signing secrets found. Decoding keystore..."
            printf '%s' "${ANDROID_KEYSTORE_B64}" | base64 --decode > release.keystore
            echo "has_signing=true" >> "$GITHUB_OUTPUT"
            echo "keystore_path=release.keystore" >> "$GITHUB_OUTPUT"
          else
            echo "Release signing secrets not fully provided. Building unsigned release artifacts..."
            echo "has_signing=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Unit Tests
        if: ${{ github.event.inputs.run_tests != false && github.event.inputs.run_tests != 'false' }}
        run: ./gradlew :app:testDebugUnitTest

      - name: Build Debug APK
        if: ${{ github.event.inputs.build_type == 'all' || github.event.inputs.build_type == 'debug' || github.event_name != 'workflow_dispatch' }}
        run: ./gradlew :app:assembleDebug

      - name: Build Release APK (Signed)
        if: ${{ steps.signing-check.outputs.has_signing == 'true' && (github.event.inputs.build_type == 'all' || github.event.inputs.build_type == 'release' || github.event_name != 'workflow_dispatch') }}
        env:
          ANDROID_KEYSTORE_PATH: release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Build Release APK (Unsigned)
        if: ${{ steps.signing-check.outputs.has_signing != 'true' && (github.event.inputs.build_type == 'all' || github.event.inputs.build_type == 'release' || github.event_name != 'workflow_dispatch') }}
        run: ./gradlew :app:assembleRelease

      - name: Build Release AAB Bundle (Signed)
        if: ${{ steps.signing-check.outputs.has_signing == 'true' && (github.event.inputs.build_type == 'all' || github.event.inputs.build_type == 'bundle' || github.event_name == 'release') }}
        env:
          ANDROID_KEYSTORE_PATH: release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease

      - name: Build Release AAB Bundle (Unsigned)
        if: ${{ steps.signing-check.outputs.has_signing != 'true' && (github.event.inputs.build_type == 'all' || github.event.inputs.build_type == 'bundle' || github.event_name == 'release') }}
        run: ./gradlew :app:bundleRelease

      - name: Collect & Organize Build Artifacts
        id: collect-artifacts
        run: |
          mkdir -p artifacts
          echo "Finding all built APKs and AABs..."
          find app/build/outputs -type f \( -name '*.apk' -o -name '*.aab' \) || true
          
          # Find and copy debug APK
          DEBUG_APK=$(find app/build/outputs/apk/debug -type f -name '*.apk' 2>/dev/null | head -n 1)
          if [ -n "$DEBUG_APK" ] && [ -f "$DEBUG_APK" ]; then
            cp "$DEBUG_APK" artifacts/fokus-launcher-debug.apk
            echo "Copied debug APK -> artifacts/fokus-launcher-debug.apk"
          fi

          # Find and copy release APK
          RELEASE_APK=$(find app/build/outputs/apk/release -type f -name '*.apk' 2>/dev/null | head -n 1)
          if [ -n "$RELEASE_APK" ] && [ -f "$RELEASE_APK" ]; then
            cp "$RELEASE_APK" artifacts/fokus-launcher-release.apk
            echo "Copied release APK -> artifacts/fokus-launcher-release.apk"
          fi

          # Find and copy release AAB
          RELEASE_AAB=$(find app/build/outputs/bundle/release -type f -name '*.aab' 2>/dev/null | head -n 1)
          if [ -n "$RELEASE_AAB" ] && [ -f "$RELEASE_AAB" ]; then
            cp "$RELEASE_AAB" artifacts/fokus-launcher-release.aab
            echo "Copied release AAB -> artifacts/fokus-launcher-release.aab"
          fi

          echo "Generated artifacts in artifacts/:"
          ls -la artifacts/

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fokus-launcher-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fokus-launcher-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Release AAB Bundle
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fokus-launcher-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
          retention-days: 30

      - name: Upload All Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fokus-launcher-all-artifacts
          path: artifacts/*
          if-no-files-found: warn
          retention-days: 30

      - name: Attach Artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        if: ${{ github.event_name == 'release' || startsWith(github.ref, 'refs/tags/') }}
        with:
          files: |
            artifacts/*
            app/build/outputs/apk/**/*.apk
            app/build/outputs/bundle/**/*.aab
          fail_on_unmatched_files: false
          generate_release_notes: true
