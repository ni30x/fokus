name: Android Auto APK Build & Release

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (all, debug, release)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - debug
          - release
      run_tests:
        description: 'Run Unit Tests'
        required: false
        default: true
        type: boolean
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  release:
    types:
      - published
      - created

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write

jobs:
  build-apks:
    name: Build APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'tools platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Ensure Debug Keystore Exists
        run: |
          if [ ! -f debug.keystore ]; then
            echo "Generating debug keystore..."
            keytool -genkeypair -v -keystore debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Check & Prepare Release Signing Secrets
        id: signing-check
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "${ANDROID_KEYSTORE_B64}" ] && [ -n "${ANDROID_KEYSTORE_PASSWORD}" ] && [ -n "${ANDROID_KEY_ALIAS}" ] && [ -n "${ANDROID_KEY_PASSWORD}" ]; then
            echo "Release signing secrets found. Decoding keystore..."
            mkdir -p "${{ runner.temp }}/keystore"
            printf '%s' "${ANDROID_KEYSTORE_B64}" | base64 --decode > "${{ runner.temp }}/keystore/release.keystore"
            echo "has_signing=true" >> "$GITHUB_OUTPUT"
            echo "keystore_path=${{ runner.temp }}/keystore/release.keystore" >> "$GITHUB_OUTPUT"
          else
            echo "Release signing secrets not fully provided. Building standard/unsigned APK..."
            echo "has_signing=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Unit Tests
        if: ${{ github.event.inputs.run_tests != false && github.event.inputs.run_tests != 'false' }}
        run: ./gradlew testDebugUnitTest

      - name: Build Debug APK
        if: ${{ github.event.inputs.build_type == 'all' || github.event.inputs.build_type == 'debug' || github.event_name != 'workflow_dispatch' }}
        run: ./gradlew :app:assembleDebug

      - name: Build Release APK (Signed)
        if: ${{ steps.signing-check.outputs.has_signing == 'true' && (github.event.inputs.build_type == 'all' || github.event.inputs.build_type == 'release' || github.event_name != 'workflow_dispatch') }}
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.signing-check.outputs.keystore_path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Build Release APK (Unsigned)
        if: ${{ steps.signing-check.outputs.has_signing != 'true' && (github.event.inputs.build_type == 'all' || github.event.inputs.build_type == 'release' || github.event_name != 'workflow_dispatch') }}
        run: ./gradlew :app:assembleRelease

      - name: Collect & Organize APK Artifacts
        id: collect-apks
        run: |
          mkdir -p artifacts
          echo "Listing all generated APKs:"
          find app/build/outputs/apk -type f -name '*.apk'
          
          # Copy debug APK if exists
          DEBUG_APK=$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)
          if [ -n "$DEBUG_APK" ] && [ -f "$DEBUG_APK" ]; then
            cp "$DEBUG_APK" artifacts/fokus-launcher-debug.apk
            echo "Found debug APK: $DEBUG_APK"
          fi

          # Copy release APK if exists
          RELEASE_APK=$(find app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)
          if [ -n "$RELEASE_APK" ] && [ -f "$RELEASE_APK" ]; then
            cp "$RELEASE_APK" artifacts/fokus-launcher-release.apk
            echo "Found release APK: $RELEASE_APK"
          fi

          echo "Final artifacts directory contents:"
          ls -la artifacts/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fokus-launcher-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fokus-launcher-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload All Built APKs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fokus-launcher-all-apks
          path: artifacts/*.apk
          if-no-files-found: ignore
          retention-days: 30

      - name: Attach APKs to GitHub Release
        uses: softprops/action-gh-release@v2
        if: ${{ github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v') }}
        with:
          files: |
            artifacts/*.apk
            app/build/outputs/apk/**/*.apk
          fail_on_unmatched_files: false
          generate_release_notes: true
